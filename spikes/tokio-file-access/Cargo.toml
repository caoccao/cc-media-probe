# Spike for G2.2 and GS.1: whether Tokio's `fs` feature alone lets the library
# open a file asynchronously for a path-based async convenience. Its own
# workspace and lock file, excluded from the root workspace (plan section 7.1).
# See README.md.

[workspace]
resolver = "3"

[package]
name = "tokio-file-access"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

[dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["fs"] }

[dev-dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["fs", "rt", "macros", "io-util"] }
