[package]
name = "cc-media-probe-cli"
description = "Spike: the command-line tool's proposed dependencies (G1.3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cc-media-probe"
path = "src/main.rs"

[dependencies]
cc-media-probe = { path = "../cc-media-probe", features = ["serde"] }
clap = { version = "4.6.8", default-features = false, features = ["std", "help", "usage", "error-context"] }
serde_json = "1.0.154"
