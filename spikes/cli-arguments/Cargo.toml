# Spike for Phase 2, task 4: checks how the approved `clap` reads the command
# line that docs/design/cli.md specifies. Its own workspace and lock file,
# excluded from the root workspace (plan section 7.1). See README.md.

[workspace]
resolver = "3"

[package]
name = "cli-arguments"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

[features]
# The two features of the dossier that the spike checks it can do without.
generated-help = ["clap/help", "clap/usage"]

[dependencies]
clap = { version = "=4.6.8", default-features = false, features = ["std", "error-context"] }
