# Spike for Phase 2, task 3: type-checks the usage scenarios of
# docs/design/api.md against a stub of the specified public surface. Its own
# workspace and lock file, excluded from the root workspace (plan section 7.1).
# See README.md.

[workspace]
resolver = "3"

[package]
name = "api-scenarios"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

# The stub is named like the library, so the scenarios read exactly as a caller writes them.
[lib]
name = "cc_media_probe"

[features]
serde = ["dep:serde"]
tokio = ["dep:tokio"]
futures-io = ["dep:futures-io"]

[dependencies]
futures-io = { version = "=0.3.34", default-features = false, features = ["std"], optional = true }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"], optional = true }
tokio = { version = "=1.54.1", default-features = false, features = ["fs"], optional = true }

[dev-dependencies]
futures-lite = "=2.6.1"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "macros", "fs", "io-util"] }

[[example]]
name = "export_json"
required-features = ["serde"]

[[example]]
name = "probe_with_tokio"
required-features = ["tokio"]

[[example]]
name = "probe_with_futures"
required-features = ["futures-io"]

[[test]]
name = "document"
required-features = ["serde"]

[[test]]
name = "writer"
required-features = ["serde"]
