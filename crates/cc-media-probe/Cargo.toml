[package]
name = "cc-media-probe"
description = "Probe multimedia files in pure Rust: container format, streams, codec parameters, chapters, tags and attachments."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
# The package ships no integration tests (plan section 9.7). Cargo drops their targets from the published manifest
# and says so with a warning for each.
exclude = ["/tests/"]

[lints]
workspace = true

# The features of `api.md` section 3.1. `zlib` joins in plan Phase 3, task 14, which first uses it.
[features]
serde = ["dep:serde"]
tokio = ["dep:tokio"]
futures-io = ["dep:futures-io"]

# The approved dependencies and settings of the dependency dossier, section 1.1.
[dependencies]
futures-io = { version = "0.3.34", default-features = false, features = ["std"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"], optional = true }
tokio = { version = "1.54.1", default-features = false, features = ["fs"], optional = true }

# The development dependencies of the dossier, section 1.3, that the tests of the async surface and of the
# serialized form use.
[dev-dependencies]
futures-lite = "2.6.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "fs", "io-util"] }

# The serialization tests of plan section 8.8, which read and write the form with serde_json.
[[test]]
name = "serialization"
required-features = ["serde"]

# The tests of the public surface as a dependent crate sees it: the traits of `api.md` section 3.3 and the entry
# points that leave a reader with its caller, which the guidelines checklist names (plan Phase 2, task 13).
[[test]]
name = "surface"

# The shipped examples of `docs/design/examples.md`. Cargo skips an example whose required features are off, so
# that list names them. The rendering halves of the quick start in `list_streams` and of `dump_tags` are tested
# with `cargo test` (plan section 9.7).
[[example]]
name = "list_streams"
test = true

[[example]]
name = "dump_tags"
test = true

[[example]]
name = "export_json"
required-features = ["serde"]

[[example]]
name = "probe_with_tokio"
required-features = ["tokio"]

[[example]]
name = "probe_with_futures"
required-features = ["futures-io"]
