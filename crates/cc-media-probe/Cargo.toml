[package]
name = "cc-media-probe"
description = "Probe multimedia files in pure Rust: container format, streams, codec parameters, chapters, tags and attachments."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

# The features of `api.md` section 3.1. `zlib` joins in plan Phase 3, task 14, which first uses it.
[features]
serde = ["dep:serde"]
tokio = ["dep:tokio"]
futures-io = ["dep:futures-io"]

# The approved dependencies and settings of the dependency dossier, section 1.1.
[dependencies]
futures-io = { version = "0.3.34", default-features = false, features = ["std"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"], optional = true }
tokio = { version = "1.54.1", default-features = false, features = ["fs"], optional = true }

# The development dependencies of the dossier, section 1.3, that the tests of the async surface and of the
# serialized form use.
[dev-dependencies]
futures-lite = "2.6.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "fs", "io-util"] }

# The serialization tests of plan section 8.8, which read and write the form with serde_json.
[[test]]
name = "serialization"
required-features = ["serde"]
