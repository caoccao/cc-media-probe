[package]
name = "cc-media-probe"
description = "Probe multimedia files in pure Rust: container format, streams, codec parameters, chapters, tags and attachments."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

# The features of `api.md` section 3.1. `zlib` joins in plan Phase 3, task 14, and `serde` in the third slice of
# Phase 2, task 11, which first use them.
[features]
tokio = ["dep:tokio"]
futures-io = ["dep:futures-io"]

# The approved dependencies and settings of the dependency dossier, section 1.1.
[dependencies]
futures-io = { version = "0.3.34", default-features = false, features = ["std"], optional = true }
tokio = { version = "1.54.1", default-features = false, features = ["fs"], optional = true }

# The development dependencies of the dossier, section 1.3, that the tests of the async surface use.
[dev-dependencies]
futures-lite = "2.6.1"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "fs", "io-util"] }
